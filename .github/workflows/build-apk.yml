name: Compilar APK Baby Medical List

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar firma fija
        id: firma
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "nueva=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug" -noprompt
            cp debug.keystore ~/.android/debug.keystore
            echo "nueva=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar firma nueva (descargala y subela al repositorio)
        if: steps.firma.outputs.nueva == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore

      - name: Preparar Capacitor y puente nativo
        run: |
          mkdir -p www/js
          cp index.html www/
          cp -r css www/
          cp js/app.js www/js/
          [ -f icon.png ] && cp icon.png www/icon.png || true

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/local-notifications@7 @capacitor/status-bar@7 @capacitor/assets html2pdf.js@0.10.1 @fontsource/nunito@5 esbuild

          cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/js/html2pdf.js
          mkdir -p www/fonts
          cp node_modules/@fontsource/nunito/files/nunito-latin-{400,600,700}-normal.woff2 www/fonts/ || true

          cat << 'EOF' > native-bridge.js
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { StatusBar, Style } from '@capacitor/status-bar';

          window.NativeShare = async function (base64Data, filename) {
            const r = await Filesystem.writeFile({ path: filename, data: base64Data, directory: Directory.Cache });
            await Share.share({ title: 'Reporte de Baby Medical List', url: r.uri, dialogTitle: 'Compartir o guardar PDF' });
          };

          window.NativeStatus = {
            oscuro: async function (si) {
              try { await StatusBar.setStyle({ style: si ? Style.Dark : Style.Light }); } catch (e) {}
            }
          };

          const CANAL = 'recordatorios';
          window.NativeNotif = {
            permiso: async function (pedir) {
              try {
                let p = await LocalNotifications.checkPermissions();
                if (p.display !== 'granted' && pedir) p = await LocalNotifications.requestPermissions();
                return p.display === 'granted';
              } catch (e) { return false; }
            },
            reprogramar: async function (lista) {
              try {
                const p = await LocalNotifications.checkPermissions();
                if (p.display !== 'granted') return false;
                try {
                  await LocalNotifications.createChannel({ id: CANAL, name: 'Recordatorios', description: 'Medicinas y citas', importance: 5, visibility: 1, vibration: true });
                } catch (e) {}
                const pend = await LocalNotifications.getPending();
                if (pend.notifications && pend.notifications.length) {
                  await LocalNotifications.cancel({ notifications: pend.notifications.map(function (n) { return { id: n.id }; }) });
                }
                if (lista.length) {
                  await LocalNotifications.schedule({
                    notifications: lista.map(function (x) {
                      return { id: x.id, title: x.title, body: x.body, channelId: CANAL, schedule: { at: new Date(x.at), allowWhileIdle: true } };
                    })
                  });
                }
                return true;
              } catch (e) { return false; }
            }
          };
          EOF

          npx esbuild native-bridge.js --bundle --outfile=www/js/native-bridge.js

          npx cap init "Baby Medical List" "com.babymedicallist.app" --web-dir www
          npx cap add android

          # Permisos normales y de alarma (se conceden al instalar o desde los ajustes del telefono)
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            grep -q "android.permission.$P" android/app/src/main/AndroidManifest.xml || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" android/app/src/main/AndroidManifest.xml
          done

          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: Fijar firma y version del APK
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = re.sub(r'versionCode\s*=?\s*\d+', 'versionCode ${{ github.run_number }}', s, count=1)
          s = re.sub(r'versionName\s*=?\s*"[^"]*"', 'versionName "1.0.${{ github.run_number }}"', s, count=1)
          firma = '''
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          '''
          s = re.sub(r'(^android\s*\{)', lambda m: m.group(1) + firma, s, count=1, flags=re.M)
          open(p, 'w').write(s)
          PY
          grep -q "storeFile" android/app/build.gradle || { echo "No se pudo fijar la firma"; exit 1; }
          grep -n "versionCode\|versionName\|storeFile" android/app/build.gradle

      - name: Compilar el APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Baby-Medical-List-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar firma del APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ESPERADA=$(keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          REAL=$("$APKSIGNER" verify --print-certs "$APK" | grep "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr -d ' ' | tr 'A-Z' 'a-z')
          echo "Huella esperada: $ESPERADA"
          echo "Huella del APK : $REAL"
          echo "Huella de firma del APK: $REAL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ESPERADA" != "$REAL" ]; then echo "::warning::LA FIRMA DEL APK NO COINCIDE CON debug.keystore"; fi
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | tail -1)
          PERMS=$("$AAPT2" dump permissions "$APK")
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM; do
            N=$(echo "$PERMS" | grep -c "android.permission.$P" || true)
            echo "Permiso $P en el APK: $N" >> "$GITHUB_STEP_SUMMARY"
            if [ "$N" = "0" ]; then echo "::warning::El APK no declara el permiso $P"; fi
          done
